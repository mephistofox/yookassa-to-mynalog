# fxTunnel Go port. Use a fresh named volume, never the Python state volume.
services:
  receipts:
    build: .
    image: fxtunnel-receipts:local
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      STATE_DB: /data/receipts-go.db
      HEALTH_LISTEN: 0.0.0.0:8099
    volumes:
      - receipts-go:/data
    ports:
      - "127.0.0.1:8099:8099"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  receipts-go:
